<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boldog születésnapot, Flóra!</title>
  <meta name="description" content="Egy gyertyafényes meglepetés Nagy-Toma Flórának.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b140f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 34C6 16 18 6 32 6s26 10 26 28c0 3-8 4-26 4S6 37 6 34z' fill='%23c0392b'/%3E%3Cpath d='M24 38c-1 10-3 16-5 20h26c-2-4-4-10-5-20z' fill='%23eadfc8'/%3E%3Ccircle cx='20' cy='22' r='4' fill='%23fff'/%3E%3Ccircle cx='36' cy='16' r='3.5' fill='%23fff'/%3E%3Ccircle cx='46' cy='28' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/almendra-normal-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">
  <a class="skip" href="#main" data-i18n="ui.skip">Ugrás a tartalomhoz</a>

  <!-- Shared SVG art: tarot icons and mushroom shapes -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="shDim" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values=".34 0 0 0 .02  0 .4 0 0 .03  0 0 .38 0 .03  0 0 0 1 0"/>
      </filter>

      <symbol id="ic-forager" viewBox="0 0 64 64">
        <path d="M8 34c0-14 10-24 24-24s24 10 24 24c0 2-6 3-24 3S8 36 8 34z"/>
        <path d="M24 37c-1 8-2 13-4 17h24c-2-4-3-9-4-17"/>
        <circle cx="22" cy="24" r="3"/><circle cx="36" cy="18" r="2.5"/><circle cx="44" cy="28" r="3"/>
      </symbol>
      <symbol id="ic-trail" viewBox="0 0 64 64">
        <path d="M4 54 24 20l10 16 8-12 18 30z"/>
        <path d="M30 54c4-6 12-6 14-12"/>
        <circle cx="48" cy="12" r="5"/>
      </symbol>
      <symbol id="ic-botanist" viewBox="0 0 64 64">
        <circle cx="32" cy="24" r="4"/>
        <ellipse cx="32" cy="11" rx="4.5" ry="8"/>
        <ellipse cx="32" cy="11" rx="4.5" ry="8" transform="rotate(72 32 24)"/>
        <ellipse cx="32" cy="11" rx="4.5" ry="8" transform="rotate(144 32 24)"/>
        <ellipse cx="32" cy="11" rx="4.5" ry="8" transform="rotate(216 32 24)"/>
        <ellipse cx="32" cy="11" rx="4.5" ry="8" transform="rotate(288 32 24)"/>
        <path d="M32 40v20"/>
        <path d="M32 52c-8-1-13-6-13-12 8 0 13 5 13 12z"/>
      </symbol>
      <symbol id="ic-animals" viewBox="0 0 64 64">
        <path d="M32 34c-8 0-14 6-12 12 2 5 8 4 12 4s10 1 12-4c2-6-4-12-12-12z"/>
        <ellipse cx="15" cy="30" rx="4.5" ry="6.5" transform="rotate(-25 15 30)"/>
        <ellipse cx="26" cy="19" rx="4.5" ry="6.5" transform="rotate(-8 26 19)"/>
        <ellipse cx="39" cy="19" rx="4.5" ry="6.5" transform="rotate(8 39 19)"/>
        <ellipse cx="50" cy="30" rx="4.5" ry="6.5" transform="rotate(25 50 30)"/>
      </symbol>
      <symbol id="ic-witch" viewBox="0 0 64 64">
        <path d="M40 8a22 22 0 1 0 14 38A18 18 0 0 1 40 8z"/>
        <path d="M50 12l1.8 4 4.2.4-3.2 2.8 1 4.2-3.8-2.2-3.8 2.2 1-4.2-3.2-2.8 4.2-.4z"/>
        <circle cx="52" cy="40" r="1.6"/><circle cx="12" cy="12" r="1.6"/>
      </symbol>
      <symbol id="ic-lens" viewBox="0 0 64 64">
        <rect x="6" y="20" width="52" height="34" rx="6"/>
        <circle cx="32" cy="37" r="11"/><circle cx="32" cy="37" r="5"/>
        <path d="M22 20l3-7h14l3 7"/>
      </symbol>

      <symbol id="sh-amanita" viewBox="0 0 60 80">
        <path d="M24 40C23 55 21 68 18 76h24c-3-8-5-21-6-36z" fill="#eadfc8"/>
        <ellipse cx="30" cy="47" rx="10" ry="3.2" fill="#cfc3a8"/>
        <path d="M3 40C3 18 15 5 30 5s27 13 27 35c0 4-7 5-27 5S3 44 3 40z" fill="#c0392b"/>
        <circle cx="17" cy="24" r="4" fill="#fff"/><circle cx="32" cy="15" r="3.4" fill="#fff"/>
        <circle cx="45" cy="27" r="4.4" fill="#fff"/><circle cx="26" cy="34" r="2.6" fill="#fff"/>
        <circle cx="39" cy="38" r="2.2" fill="#fff"/><circle cx="10" cy="37" r="2" fill="#fff"/>
      </symbol>
      <symbol id="sh-chanterelle" viewBox="0 0 60 80">
        <path d="M6 20c3-9 45-9 48 0-2 10-14 16-19 26v28c0 4-10 4-10 0V46C20 36 8 30 6 20z" fill="#e8a32a"/>
        <ellipse cx="30" cy="19" rx="24" ry="7" fill="#d98f14"/>
        <path d="M14 26c4 6 8 9 12 13M46 26c-4 6-8 9-12 13M30 30v14" fill="none" stroke="#c4790d" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="sh-porcini" viewBox="0 0 60 80">
        <path d="M18 40c-5 12-5 26 0 36h24c5-10 5-24 0-36z" fill="#e8dbbf"/>
        <path d="M4 38C4 17 16 7 30 7s26 10 26 31c0 4-8 5-26 5S4 42 4 38z" fill="#8c5a31"/>
        <path d="M12 22c4-6 10-9 17-9" fill="none" stroke="#b07a48" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      </symbol>
      <symbol id="sh-saffron" viewBox="0 0 60 80">
        <path d="M23 42v33c0 4 14 4 14 0V42z" fill="#e58b4a"/>
        <path d="M4 40C6 24 19 17 30 17s24 7 26 23c0 5-14 7-26 7S4 45 4 40z" fill="#d9742a"/>
        <path d="M13 38c5-9 28-9 34 0M20 38c3-5 17-5 20 0" fill="none" stroke="#b15a1b" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="30" cy="25" rx="10" ry="2.6" fill="#f0a05c" opacity=".7"/>
      </symbol>
      <symbol id="sh-inkcap" viewBox="0 0 60 80">
        <path d="M25 46v30h10V46z" fill="#e7e0cd"/>
        <path d="M21 14c0-8 18-8 18 0l3 33H18z" fill="#f4eee0"/>
        <path d="M22 22l6 4M33 18l5 5M24 32l7 3M32 38l6 3M20 41l5 2" fill="none" stroke="#c9bc9d" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="30" cy="47" rx="12" ry="3" fill="#2a2a2a" opacity=".55"/>
      </symbol>
    </defs>
  </svg>

  <!-- Sound control (always reachable) -->
  <div class="toolbar" role="group" aria-label="Beállítások">
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true" title="Hang bekapcsolva" aria-label="Hang bekapcsolva">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h4l5 4v-13l-5 4z"/>
        <path class="sound__waves" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>
        <path class="sound__mute" d="M17 9.5l5 5M22 9.5l-5 5"/>
      </svg>
    </button>
  </div>

  <!-- ============================== GATE ============================== -->
  <section class="gate" id="gate" aria-labelledby="gateTitle">
    <div class="gate__glow" aria-hidden="true"></div>
    <div class="gate__inner">
      <div class="gate__candle" id="gateCandle" aria-hidden="true"></div>
      <ol class="gate__dots" id="gateDots"></ol>
      <h1 class="gate__title" id="gateTitle" data-i18n="gate.title">Gyújtsd meg a gyertyát</h1>
      <p class="gate__lede" data-i18n="gate.lede"></p>

      <form class="gate__form" id="gateForm" novalidate>
        <label class="gate__label" for="gateInput" id="gateLabel"></label>
        <p class="gate__clue" id="gateClue"></p>
        <textarea class="gate__input" id="gateInput" rows="2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="gateClue gateFeedback"></textarea>
        <p class="gate__feedback" id="gateFeedback" role="status" aria-live="polite"></p>
        <div class="gate__actions">
          <button class="btn btn--flame" id="gateSubmit" type="submit"></button>
          <button class="btn btn--ghost" id="gateHint" type="button" hidden data-i18n="gate.hintBtn"></button>
        </div>
      </form>

      <div class="gate__reveal" id="gateReveal" hidden>
        <div class="cover" aria-hidden="false">
          <div class="cover__disc" aria-hidden="true"><div class="cover__vinyl"></div></div>
          <div class="cover__sleeve" id="gateSleeve"></div>
        </div>
        <p class="reveal__note" id="revealNote" role="status"></p>
        <p class="reveal__title" id="revealTitle"></p>
        <p class="reveal__artist" id="revealArtist"></p>
        <button class="btn btn--flame" id="gateContinue" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ============================== SITE ============================== -->
  <div class="site" id="site" hidden>
    <header class="hero" id="top">
      <canvas class="hero__fireflies" id="heroFireflies" aria-hidden="true"></canvas>
      <div class="hero__inner wrap">
        <figure class="hero__photo">
          <img id="heroImg" src="assets/photos/candle-4.jpg" width="1066" height="1600" alt="" fetchpriority="high">
        </figure>
        <div class="hero__copy">
          <h2 class="hero__title" id="heroTitle"></h2>
          <p class="hero__name" data-i18n="hero.name"></p>
          <p class="hero__date" data-i18n="hero.date"></p>
          <p class="hero__sub" data-i18n="hero.sub"></p>
          <a class="btn btn--flame" href="#tarot" data-i18n="hero.cta"></a>
        </div>
      </div>
      <svg class="hero__trees" id="heroTrees" viewBox="0 0 1200 160" preserveAspectRatio="none" aria-hidden="true"></svg>
    </header>

    <main id="main">
      <!-- Tarot: what she loves, one wish per card -->
      <section class="sec sec--tarot" id="tarot" aria-labelledby="tarotTitle">
        <div class="wrap">
          <h2 class="sec__title" id="tarotTitle" data-i18n="tarot.title"></h2>
          <p class="sec__lede" data-i18n="tarot.lede"></p>
          <div class="cards" id="cards"></div>
          <p class="sec__action"><button class="btn btn--ghost" id="flipAll" type="button"></button></p>
        </div>
      </section>

      <!-- Mushroom hunt -->
      <section class="sec sec--hunt" id="hunt" aria-labelledby="huntTitle">
        <div class="wrap">
          <h2 class="sec__title" id="huntTitle" data-i18n="hunt.title"></h2>
          <p class="sec__lede" data-i18n="hunt.lede"></p>
        </div>
        <div class="hunt__stage">
          <svg class="hunt__scene" id="huntScene" viewBox="0 0 800 560" role="group" data-i18n-aria="hunt.sceneLabel"></svg>
          <p class="hunt__toast" id="huntToast" role="status" aria-live="polite"></p>
        </div>
        <div class="wrap">
          <p class="hunt__counter" id="huntCounter" aria-live="polite"></p>
          <ol class="journal" id="journal"></ol>
          <div class="hunt__done" id="huntDone" hidden>
            <h3 class="hunt__doneTitle" data-i18n="hunt.doneTitle"></h3>
            <p data-i18n="hunt.doneText"></p>
            <button class="btn btn--ghost" id="huntReset" type="button" data-i18n="hunt.reset"></button>
          </div>
        </div>
      </section>

      <!-- Time, moon, stars -->
      <section class="sec sec--sky" id="sky" aria-labelledby="skyTitle">
        <div class="wrap sky">
          <div class="sky__text">
            <h2 class="sec__title" id="skyTitle" data-i18n="sky.title"></h2>
            <p class="sky__line" id="skyDays"></p>
            <p class="sky__line" id="skyLive"></p>
            <p class="sky__line" id="skyOrbits"></p>
            <p class="sky__line" id="skyMoons"></p>
            <p class="sky__aside" data-i18n="sky.friday"></p>
          </div>
          <figure class="sky__moon">
            <div id="moon" class="moon" role="img"></div>
            <figcaption id="moonCaption"></figcaption>
          </figure>
        </div>
      </section>

      <!-- Gallery -->
      <section class="sec sec--gallery" id="gallery" aria-labelledby="galleryTitle">
        <div class="wrap">
          <h2 class="sec__title" id="galleryTitle" data-i18n="gallery.title"></h2>
          <p class="sec__lede" data-i18n="gallery.lede"></p>
          <div class="filters" id="filters" role="group" data-i18n-aria="gallery.filterLabel"></div>
          <div class="shots" id="shots"></div>
        </div>
      </section>

      <!-- Make a wish -->
      <section class="sec sec--wish" id="wish" aria-labelledby="wishTitle">
        <div class="wrap wrap--narrow wish">
          <h2 class="sec__title" id="wishTitle" data-i18n="wish.title"></h2>
          <p class="sec__lede" data-i18n="wish.lede"></p>
          <button class="wish__candle" id="wishCandle" type="button"></button>
          <p class="wish__done" id="wishDone" role="status" aria-live="polite"></p>
          <button class="btn btn--ghost" id="wishRelight" type="button" hidden data-i18n="wish.relight"></button>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p class="foot__msg" data-i18n="footer.msg"></p>
      <button class="linkbtn" id="relock" type="button" data-i18n="footer.relock"></button>
    </footer>
  </div>

  <dialog class="lb" id="lightbox" aria-label="Képnézegető">
    <button class="iconbtn lb__close" id="lbClose" type="button" aria-label="Bezár" title="Bezár">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="iconbtn lb__nav lb__nav--prev" id="lbPrev" type="button" aria-label="Előző kép" title="Előző kép">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="iconbtn lb__nav lb__nav--next" id="lbNext" type="button" aria-label="Következő kép" title="Következő kép">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <figure class="lb__fig">
      <img class="lb__img" id="lbImg" alt="">
      <figcaption class="lb__cap"><span id="lbCap"></span> <span class="lb__count" id="lbCount"></span></figcaption>
    </figure>
  </dialog>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <script src="js/gate-core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
